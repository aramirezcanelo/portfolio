<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Fondo suave con el tono --paper / --bg -->
    <radialGradient id="bgGrad" cx="30%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#f5f2e9" />
      <stop offset="100%" stop-color="#e8e6df" />
    </radialGradient>

    <!-- Sombra suave para el contenedor central -->
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#20251f" flood-opacity="0.12" />
    </filter>
  </defs>

  <!-- Base cuadrada con bordes redondeados estilo --radius (26px relativo) -->
  <rect width="512" height="512" rx="110" fill="url(#bgGrad)" />

  <!-- Cuadrícula sutil de fondo (similar a .background-grid) -->
  <path d="M 0 128 L 512 128 M 0 256 L 512 256 M 0 384 L 512 384 M 128 0 L 128 512 M 256 0 L 256 512 M 384 0 L 384 512" 
        stroke="#3d654b" stroke-opacity="0.08" stroke-width="2" />

  <!-- Símbolo del logo central con rotación de -3deg (fiel a .logo-symbol) -->
  <g transform="translate(256, 256) rotate(-3)">
    <!-- Contenedor verde (--green) con bordes redondeados y sombra -->
    <rect x="-140" y="-140" width="280" height="280" rx="72" fill="#3d654b" filter="url(#softShadow)" />

    <!-- Texto / Iniciales con tipografía e interletra de la marca -->
    <text x="0" y="48" 
          font-family="Inter, system-ui, -apple-system, sans-serif" 
          font-size="140" 
          font-weight="900" 
          letter-spacing="-11" 
          fill="#f5f2e9" 
          text-anchor="middle">AR</text>

    <!-- Detalle decorativo con el verde claro (--lime) -->
    <circle cx="95" cy="-95" r="14" fill="#b8c98c" />
  </g>
</svg>
